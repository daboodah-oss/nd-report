name: Branch build (temporary)

# Build-time only, for the first ND build on a feature branch.  Delete before merging to main.
# The cloud session that builds this repo cannot reach ESPN, cfbstats or BetMGM, and workflow_dispatch
# only works for workflows that exist on main, so this runs on push to claude/* branches when the
# commit message contains [collect].  It does what "Update report" does (collect, build, commit
# data + page to the same branch) plus the one-time ESPN id resolution and the jsdom render check,
# and it saves raw source pages so the pipeline can be replayed offline (collect.py OFFLINE_RAW).

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: contains(github.event.head_commit.message, '[collect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Resolve ESPN ids (only roster entries with an empty espn_id)
        id: ids
        continue-on-error: true
        env:
          SAVE_RAW: "1"
        run: |
          mkdir -p logs
          set -o pipefail
          python tools/resolve_espn_ids.py --write --current-first 6:102/144/1378/16/1 2>&1 | tee logs/resolve_ids.txt
      - name: Collect new data
        id: collect
        if: steps.ids.outcome == 'success'
        continue-on-error: true
        env:
          SAVE_RAW: "1"
        run: |
          set -o pipefail
          python collect.py 2>&1 | tee logs/collect.txt
      - name: Build page (validation must pass)
        id: build
        if: steps.ids.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python build_report.py --standalone --out index.html 2>&1 | tee logs/build.txt
      - name: Render check (jsdom)
        id: render
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund jsdom@24.1.0 > /dev/null
          node tools/render_check.js index.html 2>&1 | tee logs/render_check.txt
      - name: Commit to this branch
        run: |
          git config user.name "nd-report bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data roster.json
          [ -f index.html ] && git add index.html || true
          git add -f logs
          [ -d raw ] && git add -f raw || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Branch build $(date -u +%F) ids=${{ steps.ids.outcome }} collect=${{ steps.collect.outcome }} build=${{ steps.build.outcome }} render=${{ steps.render.outcome }}"; git pull --rebase -q || true; git push; fi
      - name: Report problems
        if: steps.ids.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.build.outcome == 'failure' || steps.render.outcome == 'failure'
        run: |
          echo "ids=${{ steps.ids.outcome }} collect=${{ steps.collect.outcome }} build=${{ steps.build.outcome }} render=${{ steps.render.outcome }}; see logs/ on this branch"
          exit 1
